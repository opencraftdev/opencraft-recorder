name: Build macOS

# Builds an unsigned macOS .dmg on a real Mac runner and uploads it as an
# artifact. Run it from the Actions tab (workflow_dispatch) or on pushes to main.
# Download the .dmg from the run's Artifacts section.
#
# Assumes this folder (recorder-app) is the repository root: `git init` here,
# push to GitHub, then the workflow is at .github/workflows/build-mac.yml.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write # create/update the Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build .dmg
        run: npm run build:mac
        env:
          # Skip code-signing/notarization — personal/unsigned build.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Normalize the asset to a STABLE name so the web app's
      # /releases/latest/download/<name> URL never changes between versions.
      - name: Stage .dmg with a stable name
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg | head -n1)
          cp "$DMG" "dist/opencraft-recorder-mac-arm64.dmg"
          echo "Staged $(du -h "dist/opencraft-recorder-mac-arm64.dmg" | cut -f1)"

      - name: Upload .dmg (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: opencraft-recorder-mac
          path: dist/opencraft-recorder-mac-arm64.dmg
          if-no-files-found: error

      # Publish the .dmg to a GitHub Release on a moving "latest" tag, so
      # /releases/latest/download/opencraft-recorder-mac-arm64.dmg always serves
      # the newest build. (Anonymous download requires the repo to be public.)
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest build" \
            --notes "Automated macOS build (arm64, unsigned). First launch: right-click → Open." \
            "dist/opencraft-recorder-mac-arm64.dmg"
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/opencraft-recorder-mac-arm64.dmg"
