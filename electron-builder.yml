appId: com.opencraft.recorder
productName: OpenCraft Recorder
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - "!**/*.map"
# Register the custom URL scheme so the OS can launch the app from the web
# (opencraft-recorder://record).
protocols:
  - name: OpenCraft Recorder
    schemes:
      - opencraft-recorder
mac:
  target:
    - dmg
  category: public.app-category.productivity
  # Unsigned local/personal build — first launch needs right-click → Open.
  identity: null
  extendInfo:
    NSCameraUsageDescription: Used to record your webcam into tutorials.
    NSMicrophoneUsageDescription: Used to record your narration.
    NSScreenCaptureUsageDescription: Used to record your screen.
dmg:
  title: OpenCraft Recorder
